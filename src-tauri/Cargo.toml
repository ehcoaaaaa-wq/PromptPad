[package]
name = "promptpad"
version = "0.3.1"
description = "A prompt template manager"
authors = ["PromptPad"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "promptpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# dev profile: 减少磁盘占用,避免每次 cargo build 显著涨空间
# - incremental=false: 不写 1.8GB 增量缓存
# - debug="line-tables-only": 只保留行号,体积从完整 pdb(80-130MB/crate)缩到几 MB
# - package."*": 把所有依赖的 debug 符号剥掉,opt-level=0 保持 debug 编译速度
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
opt-level = 0
